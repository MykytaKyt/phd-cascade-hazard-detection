[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis"
version = "0.1.0"
description = "Cascaded detection of hazardous events in video surveillance: kinematic filter, risk-based routing, semantic verification and Dempster-Shafer fusion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mykyta Kyt", email = "mykyta.kyt@nure.ua" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
pose = ["ultralytics>=8.1"]
vlm = ["openai>=1.0"]
vad = ["open_clip_torch>=2.24", "decord>=0.6"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
